<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fallen Rome</title>
<style>
:root{--bg:#120c0c;--panel:#1d1414;--line:#3a2626;--gold:#d4a24c;--red:#a8322b;--text:#efe6d8;--mute:#9a8a78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;letter-spacing:3px;color:var(--gold)}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px}
nav button.on,.btn:hover,nav button:hover{border-color:var(--gold);color:var(--gold)}
input#q{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:6px;min-width:180px}
main{padding:24px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;color:var(--gold);font-size:17px}
.card p{margin:0;color:var(--mute);font-size:13px;flex:1}
.tag{font-size:11px;color:var(--red);text-transform:uppercase;letter-spacing:1px}
.off{opacity:.55}
.row{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
canvas{background:#000;border:2px solid var(--gold);max-width:100%}
#frame{width:100%;height:78vh;border:1px solid var(--line);background:#000;border-radius:8px}
code{background:#000;padding:2px 6px;border-radius:4px;color:var(--gold)}
.note{color:var(--mute);font-size:13px;margin:6px 0 16px}
</style>
</head>
<body>
<header>
  <h1>FALLEN ROME</h1>
  <nav id="nav"></nav>
  <input id="q" placeholder="Search...">
</header>
<main id="main"></main>

<script>
/* =========================================================
   CONFIG. Edit this section. Leave url "" for anything not
   filled in. No live links were verified; paste ones you trust.
   Everything opens in an about:blank tab with the page's
   code written into that tab (fetch + document.write).
   ========================================================= */
const CLOAK_TITLE="Google Docs";
// Optional CORS proxy that returns the target page's HTML, e.g. "https://your-worker.example.workers.dev/?url="
// Needed for most third-party sites, because browsers block reading their code directly.
const PROXY="";
const HUBS = [
  {name:"Reid's Games",    desc:"Games and some movies", url:"https://raw.githubusercontent.com/Cra-Z-Gaming/VUSL/refs/heads/main/Other/REIDS-GAMES"},
  {name:"Polaris Hub",     desc:"Big games hub",         url:"https://raw.githubusercontent.com/Cra-Z-Gaming/VUSL/refs/heads/main/Other/PolarisHub"},
  {name:"GN Math",         desc:"Games hub",             url:"https://raw.githubusercontent.com/Cra-Z-Gaming/VUSL/refs/heads/main/Other/gn-math"},
  {name:"Nike Hub",        desc:"Not found in the VUS list. Paste a URL here.", url:""},
  {name:"Itsuki Chat Hub", desc:"Global chat hub",       url:"https://raw.githubusercontent.com/AniItsukiCoded/backups/refs/heads/main/(USE)%20-%20Launcher%20Loader.html"},
];
// Files: single-file apps fetched and written into about:blank.
const FILES = [
  {name:"Ultimate Game Stash", desc:"One of the biggest stashes", url:"https://raw.githubusercontent.com/Cra-Z-Gaming/VUSL/refs/heads/main/Other/UltimateGameStash"},
  {name:"Gust",                desc:"Gust (file, not a site)",    url:"https://cdn.jsdelivr.net/gh/nautilus-os/GUST@latest/svg/site.svg"},
];
const NAUTILUS = {name:"Nautilus OS", desc:"Web OS", url:"https://raw.githubusercontent.com/Cra-Z-Gaming/VUSL/refs/heads/main/Other/NautilusOS"};
const OPIUM = [
  // Researched from the Opium GitHub READMEs, its mirror page, and the VUS zip. Opened directly, not in about:blank.
  {name:"Opium (official)",   desc:"opium-games.com",            url:"https://opium-games.com/"},
  {name:"Cloudflare 1",       desc:"op1um.pages.dev",            url:"https://op1um.pages.dev"},
  {name:"Cloudflare 2",       desc:"opiumm.pages.dev",           url:"https://opiumm.pages.dev"},
  {name:"Cloudflare 3",       desc:"op1umm.pages.dev",           url:"https://op1umm.pages.dev"},
  {name:"Cloudflare (alt)",   desc:"opium-games.pages.dev",      url:"https://opium-games.pages.dev"},
  {name:"CFISD redirect",     desc:"opium-cfisd.pages.dev",      url:"https://opium-cfisd.pages.dev"},
  {name:"CybriaTech",         desc:"opium.cybriatech.dev",       url:"https://opium.cybriatech.dev"},
  {name:"Render",             desc:"opium-games.onrender.com",   url:"https://opium-games.onrender.com/"},
  {name:"Testing site",       desc:"tst.opium-games.com",        url:"https://tst.opium-games.com/"},
  {name:"Testing (Neocities)",desc:"opium-tst.neocities.org",    url:"https://opium-tst.neocities.org"},
  {name:"Opium (opium.best)", desc:"From the VUS list",          url:"https://opium.best/"},
  {name:"Opium (unpkg)",      desc:"opiumbest on unpkg",         url:"https://unpkg.com/opiumbest@1.0.1/index.svg"},
  {name:"Opium study #1",     desc:"From the VUS list",          url:"https://storage.googleapis.com/gclassroom/study.html"},
  {name:"Opium study #2",     desc:"From the VUS list",          url:"https://s3.amazonaws.com/cleverlearning/study"},
  {name:"Opium study #3",     desc:"From the VUS list",          url:"https://s3.dualstack.us-east-1.amazonaws.com/cleverlearning/study"},
  {name:"Opium study #4",     desc:"From the VUS list",          url:"https://storage.googleapis.com/opiumbest/study.html"},
];

/* ---------- internals ---------- */
const BASE = window.FR_BASE || location.href;  // real URL even when running inside about:blank
const GAMES=[
  {id:"snake",name:"Snake",desc:"Arrow keys / WASD."},
  {id:"memory",name:"Memory Match",desc:"Flip pairs of symbols."},
  {id:"pong",name:"Pong",desc:"W/S or Up/Down vs CPU."},
];
const $=s=>document.querySelector(s), main=$("#main"), nav=$("#nav");
const TABS=["Games","Hubs","Files","Nautilus OS","Opium"];
let tab="Games", stop=null;

/* Open a URL in about:blank and inject its code into that tab.
   Same-origin pages and CORS-enabled sites get injected. Sites that
   block cross-origin fetch fall back to a full-page iframe, which
   only works if the site allows embedding. */
function openBlank(url,title){
  const abs=new URL(url,BASE).href;
  const w=window.open("about:blank","_blank");   // must run synchronously in the click
  if(!w){alert("Popup blocked. Allow popups for this page and try again.");return}
  w.document.write("<title>"+(title||CLOAK_TITLE)+"</title><body style='background:#000;color:#999;font-family:sans-serif'>Loading...");
  getHtml(abs).then(html=>{
    const inj='<base href="'+abs+'"><script>window.FR_BASE="'+abs+'"<\/script>';
    html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+inj):inj+html;
    const d=w.document;d.open();d.write(html);d.close();
    setTimeout(()=>{try{w.document.title=title||CLOAK_TITLE}catch(e){}},400);
  }).catch(()=>{
    const d=w.document;d.open();
    d.write('<!doctype html><title>'+CLOAK_TITLE+'</title><body style="background:#120c0c;color:#efe6d8;font-family:Georgia,serif;padding:32px"><h2 style="color:#d4a24c">Could not load the code for this page</h2><p>'+abs+'</p><p>That site blocks cross-origin requests, so its code cannot be read from here. Set <code>PROXY</code> at the top of Fallen Rome to a CORS proxy you control, or host the file on the same origin as Fallen Rome.</p>');
    d.close();
  });
}
/* Fetch page source. Direct first (same-origin or CORS-enabled). If blocked
   and PROXY is set, retry through it. No iframes anywhere. */
async function getHtml(abs){
  try{const r=await fetch(abs);if(!r.ok)throw 0;return await r.text()}
  catch(e){
    if(!PROXY)throw e;
    const r=await fetch(PROXY+encodeURIComponent(abs));if(!r.ok)throw e;return await r.text();
  }
}
/* Open a built-in game in about:blank with its code written into that tab. */
function openGame(id,name){
  const w=window.open("about:blank","_blank");
  if(!w){alert("Popup blocked. Allow popups for this page and try again.");return}
  const fn={snake,memory,pong}[id];
  const d=w.document;d.open();
  d.write('<!doctype html><title>'+CLOAK_TITLE+'</title><body style="margin:0;background:#120c0c;color:#d4a24c;font-family:Georgia,serif;text-align:center"><div id="info" style="padding:8px"></div><canvas id="c" width="480" height="480" style="background:#000;border:2px solid #d4a24c;max-width:100%"></canvas><script>(function(){var c=document.getElementById("c");('+fn.toString()+')(c,c.getContext("2d"),document.getElementById("info"))})()<\/script></body>');
  d.close();
}
function cardLink(x,label){
  const ok=!!x.url;
  return `<div class="card ${ok?"":"off"}"><span class="tag">${label}</span><h3>${x.name}</h3><p>${x.desc||""}${ok?"":" (not set up yet)"}</p>${
    ok?`<button class="btn" data-url="${x.url.replace(/"/g,"&quot;")}" data-name="${x.name}">Open in about:blank</button>`:`<span class="btn">Not set up</span>`}</div>`;
}
function cardDirect(x,label){
  return `<div class="card"><span class="tag">${label}</span><h3>${x.name}</h3><p>${x.desc||""}</p><a class="btn" href="${x.url.replace(/"/g,"&quot;")}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Open</a></div>`;
}
function renderNav(){
  nav.innerHTML="";
  TABS.forEach(t=>{const b=document.createElement("button");b.textContent=t;
    if(t===tab)b.className="on";b.onclick=()=>{tab=t;render()};nav.appendChild(b)});
}
function render(){
  if(stop){stop();stop=null}
  renderNav();
  const q=$("#q").value.toLowerCase(), f=a=>a.filter(x=>!q||x.name.toLowerCase().includes(q));
  if(tab==="Games") main.innerHTML=`<div class="grid">${f(GAMES).map(g=>`<div class="card"><span class="tag">Built in</span><h3>${g.name}</h3><p>${g.desc}</p><div class="row"><button class="btn" onclick="openGame('${g.id}')">Play in about:blank</button><button class="btn" onclick="play('${g.id}')">Play here</button></div></div>`).join("")}</div>`;
  else if(tab==="Hubs") main.innerHTML=`<p class="note">Set URLs in the HUBS config at the top of this file.</p><div class="grid">${f(HUBS).map(h=>cardLink(h,"Hub")).join("")}</div>`;
  else if(tab==="Files") main.innerHTML=`<p class="note">These are fetched and written into the about:blank tab.</p><div class="grid">${f(FILES).map(x=>cardLink(x,"File")).join("")}</div>`;
  else if(tab==="Nautilus OS") main.innerHTML=`<div class="grid">${cardLink(NAUTILUS,"OS")}</div>`;
  else main.innerHTML=OPIUM.length?`<div class="grid">${f(OPIUM).map(o=>cardDirect(o,"Opium")).join("")}</div>`:`<p class="note">Opium folder is empty. Add links to the <code>OPIUM</code> array.</p>`;
  main.querySelectorAll("button[data-url]").forEach(b=>b.onclick=()=>openBlank(b.dataset.url,CLOAK_TITLE));
}
$("#q").oninput=render;

function play(id){
  main.innerHTML=`<div style="text-align:center"><div class="row"><button class="btn" onclick="render()">Back</button><b id="info"></b></div><canvas id="c" width="480" height="480"></canvas></div>`;
  const c=$("#c");stop=({snake,memory,pong})[id](c,c.getContext("2d"),$("#info"));
}

/* Game functions are self-contained (they get serialized into about:blank). */
function snake(c,x,info){
  var N=20,S=24,s=[{x:10,y:10}],d={x:1,y:0},nd=d,f={x:5,y:5},score=0,dead=false;
  function place(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(s.some(function(p){return p.x==f.x&&p.y==f.y}))}
  function key(e){var m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();if(m[0]!==-d.x||m[1]!==-d.y)nd={x:m[0],y:m[1]}}
    if(e.key===" "&&dead){s=[{x:10,y:10}];d=nd={x:1,y:0};score=0;dead=false;place()}}
  addEventListener("keydown",key);
  var t=setInterval(function(){
    if(!dead){d=nd;var h={x:(s[0].x+d.x+N)%N,y:(s[0].y+d.y+N)%N};
      if(s.some(function(p){return p.x==h.x&&p.y==h.y}))dead=true;else{s.unshift(h);
        if(h.x==f.x&&h.y==f.y){score++;place()}else s.pop()}}
    x.fillStyle="#000";x.fillRect(0,0,480,480);
    x.fillStyle="#a8322b";x.fillRect(f.x*S,f.y*S,S-2,S-2);
    x.fillStyle="#d4a24c";s.forEach(function(p){x.fillRect(p.x*S,p.y*S,S-2,S-2)});
    info.textContent="Score "+score+(dead?" - Game over, press Space":"");
  },100);
  return function(){clearInterval(t);removeEventListener("keydown",key)};
}
function memory(c,x,info){
  var sy="ABCDEFGH".split(""),cards=sy.concat(sy).sort(function(){return Math.random()-.5}).map(function(v){return{v:v,up:false,done:false}});
  var pick=[],lock=false,moves=0;
  function draw(){x.fillStyle="#000";x.fillRect(0,0,480,480);x.font="40px Georgia";x.textAlign="center";x.textBaseline="middle";
    cards.forEach(function(k,i){var cx=(i%4)*120,cy=(i/4|0)*120;
      x.fillStyle=k.done?"#3a2626":k.up?"#d4a24c":"#a8322b";x.fillRect(cx+6,cy+6,108,108);
      if(k.up||k.done){x.fillStyle="#120c0c";x.fillText(k.v,cx+60,cy+60)}});
    info.textContent="Moves "+moves+(cards.every(function(k){return k.done})?" - You win":"")}
  function click(e){if(lock)return;var r=c.getBoundingClientRect(),sc=480/r.width;
    var i=((e.clientY-r.top)*sc/120|0)*4+((e.clientX-r.left)*sc/120|0),k=cards[i];
    if(!k||k.up||k.done)return;k.up=true;pick.push(k);
    if(pick.length==2){moves++;lock=true;var a=pick[0],b=pick[1];
      setTimeout(function(){if(a.v===b.v)a.done=b.done=true;a.up=b.up=false;pick=[];lock=false;draw()},600)}
    draw()}
  c.addEventListener("click",click);draw();
  return function(){c.removeEventListener("click",click)};
}
function pong(c,x,info){
  var p=200,a=200,bx=240,by=240,vx=4,vy=3,ps=0,as=0,up=false,dn=false;
  function kd(e){if(e.key=="ArrowUp"||e.key=="w")up=true;if(e.key=="ArrowDown"||e.key=="s")dn=true;if(e.key.indexOf("Arrow")==0)e.preventDefault()}
  function ku(e){if(e.key=="ArrowUp"||e.key=="w")up=false;if(e.key=="ArrowDown"||e.key=="s")dn=false}
  addEventListener("keydown",kd);addEventListener("keyup",ku);
  function reset(d){bx=240;by=240;vx=4*d;vy=(Math.random()*4-2)||2}
  var t=setInterval(function(){
    if(up)p-=6;if(dn)p+=6;p=Math.max(0,Math.min(400,p));
    a+=Math.sign(by-(a+40))*3.5;a=Math.max(0,Math.min(400,a));
    bx+=vx;by+=vy;if(by<0||by>476)vy=-vy;
    if(bx<20&&by>p&&by<p+80&&vx<0){vx=-vx*1.05;vy+=(by-(p+40))/10}
    if(bx>456&&by>a&&by<a+80&&vx>0){vx=-vx*1.05}
    if(bx<0){as++;reset(1)}if(bx>480){ps++;reset(-1)}
    x.fillStyle="#000";x.fillRect(0,0,480,480);x.fillStyle="#d4a24c";
    x.fillRect(8,p,10,80);x.fillRect(462,a,10,80);x.fillRect(bx-4,by-4,8,8);
    info.textContent="You "+ps+" : "+as+" CPU";
  },16);
  return function(){clearInterval(t);removeEventListener("keydown",kd);removeEventListener("keyup",ku)};
}

/* Offer to relaunch this whole site inside about:blank (code injected). */
if(window.top===window.self && location.protocol!=="about:" && !window.FR_BASE){
  addEventListener("DOMContentLoaded",()=>{
    const bar=document.createElement("div");
    bar.style.cssText="background:#2a1a1a;border-bottom:1px solid #3a2626;padding:8px 24px;font-size:13px;display:flex;gap:10px;align-items:center";
    bar.innerHTML='<span>Launch Fallen Rome in about:blank?</span><button class="btn" id="frgo">Launch</button><button class="btn" id="frno">Dismiss</button>';
    document.body.prepend(bar);
    bar.querySelector("#frgo").onclick=()=>openBlank(location.href,"Fallen Rome");
    bar.querySelector("#frno").onclick=()=>bar.remove();
  });
}
render();
</script>
</body>
</html>
